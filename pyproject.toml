[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-bw"
version = "1.0.0"
description = "Breit-Wheeler opacity and secondary pair spectra in isotropic radiation fields"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Divyen Harke", email = "harke.physics@gmail.com"}
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9"
]

[project.optional-dependencies]
units = [
    "astropy>=5.0"
]
validation = [
    "mpmath>=1.2"
]
test = [
    "pytest>=7",
    "pytest-cov>=4",
    "astropy>=5.0",
    "mpmath>=1.2"
]

[project.urls]
Repository = "https://github.com/harke-div/thermal-bw"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["thermal_bw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=thermal_bw --cov-report=term-missing --cov-fail-under=90"
